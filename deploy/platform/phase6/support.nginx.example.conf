# Same-host nginx: support.jar deliberately listens on loopback only.
# Replace host and certificate paths before validating nginx -t.
server {
    listen 443 ssl;
    server_name support.example.invalid;
    ssl_certificate /etc/harness/tls/support.crt;
    ssl_certificate_key /etc/harness/tls/support.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host support.example.invalid;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
