# Include only inside the existing opsagent.cloud HTTPS server.
# Preserve its root /, /api/, ACME, certificate and management-denial locations.
# The edge has the exact private IP configured as Tomcat's trusted proxy.
# Keep resolvers inside locations: the existing Ops server already has one.

location = /console { return 308 /console/$is_args$args; }
location ^~ /console/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $harness_api harness-api:8097;
    proxy_pass http://$harness_api;
    proxy_http_version 1.1;
    proxy_set_header Host opsagent.cloud;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host opsagent.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_read_timeout 75s;
    client_max_body_size 256k;
}

location ^~ /v1/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $harness_api harness-api:8097;
    proxy_pass http://$harness_api;
    proxy_http_version 1.1;
    proxy_set_header Host opsagent.cloud;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host opsagent.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_read_timeout 75s;
    client_max_body_size 256k;
}

location = /support { return 308 /support/$is_args$args; }
location = /support/health { return 404; }
location ^~ /support/health/ { return 404; }
location ^~ /support/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $harness_support support:8098;
    rewrite ^/support/(.*)$ /$1 break;
    proxy_pass http://$harness_support;
    proxy_http_version 1.1;
    proxy_set_header Host opsagent.cloud;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host opsagent.cloud;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_cookie_path / /support/;
    proxy_next_upstream off;
    proxy_buffering off;
    proxy_read_timeout 75s;
    client_max_body_size 256k;
}

location = /health { return 404; }
location ^~ /health/ { return 404; }
# The existing Ops config already denies /internal and /internal/.
# Do not duplicate those location definitions when adding this include.
