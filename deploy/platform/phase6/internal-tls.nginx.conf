# Private gateway only: no host port and no public nginx route to this listener.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/tls/server-chain.pem;
    ssl_certificate_key /run/tls/server-key.pem;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Port "";
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_buffering off;

    server {
        listen 8443 ssl default_server;
        ssl_reject_handshake on;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name harness-identity.internal;
        if ($ssl_server_name != harness-identity.internal) { return 421; }
        if ($host != harness-identity.internal) { return 421; }
        set $identity_backend ops-auth-app:8101;
        location = /api/auth/captcha {
            if ($request_method != GET) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location = /api/auth/login {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location = /internal/harness/introspect {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location = /internal/harness/delegations {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location ~ "^/internal/harness/delegations/[a-f0-9-]{36}$" {
            if ($request_method != GET) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location ~ "^/internal/harness/delegations/[a-f0-9-]{36}/(?:token|output-token)$" {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$identity_backend;
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name harness-rag.internal;
        if ($ssl_server_name != harness-rag.internal) { return 421; }
        if ($host != harness-rag.internal) { return 421; }
        set $rag_backend ops-rag-app:8104;
        location = /internal/rag/search {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$rag_backend;
        }
        location = /internal/rag/validate-citations {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$rag_backend;
        }
        location = /internal/rag/output/validate-citations {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$rag_backend;
        }
        location = /internal/rag/harness/answer-access {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$rag_backend;
        }
        location = /internal/rag/harness/output-answer-access {
            if ($request_method != POST) { return 405; }
            proxy_pass http://$rag_backend;
        }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        server_name harness-platform.internal;
        if ($ssl_server_name != harness-platform.internal) { return 421; }
        if ($host != harness-platform.internal) { return 421; }
        set $platform_backend harness-api:8097;
        location ^~ /v1/projects/ {
            if ($request_method !~ ^(?:GET|POST)$) { return 405; }
            proxy_pass http://$platform_backend;
        }
        location / { return 404; }
    }
}
