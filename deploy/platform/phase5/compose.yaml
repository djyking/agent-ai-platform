name: harness-phase5
x-platform: &platform
  image: ${HARNESS_IMAGE:?Set an immutable release image or digest}
  env_file: [./private/runtime.env]
  read_only: true
  tmpfs: [/tmp:size=64m,mode=1777]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  stop_grace_period: 120s
  networks: [runtime]
  volumes:
    - ./private/config:/run/harness:ro
  environment: &runtime-environment
    HARNESS_ENVIRONMENT: ${HARNESS_ENVIRONMENT:-staging}
    HARNESS_SCHEMA_MODE: validate
    HARNESS_IDENTITY_PROVIDER: opsagent
    SERVER_ADDRESS: 0.0.0.0
    HARNESS_PORT: 8097
    HARNESS_CONFIG: /run/harness/api.json
    SERVER_FORWARD_HEADERS_STRATEGY: native
    SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '172\.30\.81\.10'
    SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER: X-Forwarded-Proto
    SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: X-Forwarded-For
    SERVER_TOMCAT_REMOTEIP_HOST_HEADER: X-Forwarded-Host
    SERVER_TOMCAT_REMOTEIP_PORT_HEADER: X-Forwarded-Port
services:
  api:
    <<: *platform
    environment:
      <<: *runtime-environment
      HARNESS_INSTANCE_ID: api
  worker1:
    <<: *platform
    environment:
      <<: *runtime-environment
      HARNESS_CONFIG: /run/harness/worker.json
      HARNESS_INSTANCE_ID: worker1
      SERVER_FORWARD_HEADERS_STRATEGY: none
  worker2:
    <<: *platform
    environment:
      <<: *runtime-environment
      HARNESS_CONFIG: /run/harness/worker.json
      HARNESS_INSTANCE_ID: worker2
      SERVER_FORWARD_HEADERS_STRATEGY: none
  migrate:
    <<: *platform
    profiles: [migration]
    env_file: [./private/migration.env]
    command: [migrate]
    restart: 'no'
    environment:
      <<: *runtime-environment
      HARNESS_SCHEMA_MODE: validate
      HARNESS_MIGRATION_OFFLINE_ACK: ${HARNESS_MIGRATION_OFFLINE_ACK:-}
  ingress:
    image: nginx:1.28.0-alpine
    ports: ["${HARNESS_BIND_ADDRESS:-127.0.0.1}:${HARNESS_HTTPS_PORT:-8443}:443"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./private/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./private/tls:/run/tls:ro
    networks:
      runtime:
        ipv4_address: 172.30.81.10
    depends_on: [api]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=14d]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - ./private/metrics-token:/run/secrets/metrics-token:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [runtime]
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring]
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [runtime]
    restart: unless-stopped
  alert-test-sink:
    image: python:3.12.11-alpine
    profiles: [monitoring]
    command: [python, /app/alert_sink.py, --bind, 0.0.0.0, --destination, /evidence/alerts.jsonl]
    user: '10001:10001'
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes:
      - ./alert_sink.py:/app/alert_sink.py:ro
      - ./private/alert-evidence:/evidence
    networks: [runtime]
  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    command: [--collector.disable-defaults, --collector.textfile, --collector.textfile.directory=/textfile]
    volumes: ["${HARNESS_BACKUP_METRICS_DIRECTORY:-./private/backup-metrics}:/textfile:ro"]
    networks: [runtime]
  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./private/grafana-password:/run/secrets/grafana-password:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [runtime]
    restart: unless-stopped
networks:
  runtime:
    ipam:
      config: [{subnet: 172.30.81.0/24}]
volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
