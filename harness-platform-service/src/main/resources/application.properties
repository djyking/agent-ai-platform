server.address=127.0.0.1
server.port=${HARNESS_PORT:8097}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-swallow-size=64KB
server.tomcat.max-http-form-post-size=64KB
spring.main.banner-mode=off
spring.datasource.url=${HARNESS_JDBC_URL}
spring.datasource.username=${HARNESS_JDBC_USER}
spring.datasource.password=${HARNESS_JDBC_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=5000
logging.level.root=WARN
logging.level.io.github.djyking.harness.platform=INFO
logging.level.io.github.djyking.harness.core.StructuredTelemetry=INFO
