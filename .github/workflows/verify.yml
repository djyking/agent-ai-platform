name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform-console/package.json
      - name: Install console dependencies
        run: pnpm --dir platform-console install --frozen-lockfile
      - name: Test console
        run: pnpm --dir platform-console test
      - name: Test customer support login and approval UI
        run: node --test support-pilot/src/test/js/approval.test.mjs support-pilot/src/test/js/auth.test.mjs support-pilot/src/test/js/base-path.test.mjs
      - name: Build console into platform artifact
        run: pnpm --dir platform-console build
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: bash ./mvnw clean verify -B -ntp
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify -B -ntp
      - name: Verify effective Spring configuration using built artifact dependencies
        run: python deploy/platform/phase6/tests/run_spring_binding.py --jar harness-platform-service/target/harness-platform-service-0.1.0-SNAPSHOT.jar
      - name: Validate deployment templates against built Java contracts
        run: python validation/platform/phase5_deployment_validate.py --jar harness-platform-service/target/harness-platform-service-0.1.0-SNAPSHOT.jar --report .work/phase5/deployment-contracts.json
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/api/requirements.txt
      - name: Install contract validators
        run: python -m pip install -r docs/api/requirements.txt
      - name: Validate API contract
        run: python docs/api/validate_contract.py
      - name: Validate catalog API contract
        run: python docs/api/validate_catalog.py
      - name: Validate deployment and recovery safety
        run: python validation/platform/phase5_deployment_test.py
      - name: Validate delivery bundle safety
        run: python validation/platform/phase5_bundle_test.py
      - name: Validate continuous observation accounting
        run: python -m unittest discover -s validation/platform -p "test_phase6_*.py"
      - name: Install Compose version used by the target environment
        uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.5.1
      - name: Verify Compose version for offline configuration checks
        run: |
          compose_version="$(docker compose version --short)"
          echo "Docker Compose ${compose_version}"
          test "${compose_version#v}" = "5.5.1"
      - name: Install nginx for ingress configuration regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
      - name: Validate selected Ops and platform deployment
        env:
          HARNESS_NGINX_BINARY: /usr/sbin/nginx
        run: python -m unittest discover -s deploy/platform/phase6/tests -p "test_*.py"
