name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify on Linux
        if: runner.os != 'Windows'
        run: bash ./mvnw clean verify -B -ntp
      - name: Verify on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd clean verify -B -ntp
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/api/requirements.txt
      - name: Install contract validators
        run: python -m pip install -r docs/api/requirements.txt
      - name: Validate API contract
        run: python docs/api/validate_contract.py
